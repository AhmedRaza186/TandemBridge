<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 64 64" fill="none">
  <title>TandemBridge</title>
  <rect width="64" height="64" rx="15" fill="#1f5f5b"/>
  <!-- deck -->
  <path d="M8 44H56" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <!-- towers -->
  <path d="M20 17V51M44 17V51" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- main cable between the towers, and the side spans -->
  <path d="M20 19C27 36 37 36 44 19" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M8 40C13 33 17 25 20 19M44 19C47 25 51 33 56 40" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <!-- hangers -->
  <path d="M26 30V44M32 33V44M38 30V44" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <!-- the two agents working in tandem -->
  <circle cx="20" cy="14" r="5" fill="#e0855c" stroke="#1f5f5b" stroke-width="2"/>
  <circle cx="44" cy="14" r="5" fill="#6f9cf0" stroke="#1f5f5b" stroke-width="2"/>
</svg>
