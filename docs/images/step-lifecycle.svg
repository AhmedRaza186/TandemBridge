<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a857b"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#f7f6f2"/>
  <text x="32" y="44" font-size="20" font-weight="700" fill="#1c1b19">The life of one step</text>
  <text x="32" y="68" font-size="13" fill="#66625a">Nothing is trusted on the agent's word: every step is checked before it is committed.</text>

  <g font-size="12" fill="#66625a" text-anchor="middle">
    <rect x="32" y="100" width="134" height="84" rx="10" fill="#ffffff" stroke="#e0ddd5"/>
    <text x="99" y="126" font-size="13.5" font-weight="700" fill="#1c1b19">1 · Claim</text>
    <text x="99" y="146">next ready step,</text>
    <text x="99" y="162">prompt with rules</text>

    <rect x="188" y="100" width="134" height="84" rx="10" fill="#ffffff" stroke="#e0ddd5"/>
    <text x="255" y="126" font-size="13.5" font-weight="700" fill="#1c1b19">2 · Agent works</text>
    <text x="255" y="146">limited commands,</text>
    <text x="255" y="162">live log, usage guard</text>

    <rect x="344" y="100" width="134" height="84" rx="10" fill="#ffffff" stroke="#e0ddd5"/>
    <text x="411" y="126" font-size="13.5" font-weight="700" fill="#1c1b19">3 · Result file</text>
    <text x="411" y="146" font-family="Consolas, monospace" font-size="11">.bridge/result-id</text>
    <text x="411" y="162">done · question · fixes</text>

    <rect x="500" y="100" width="134" height="84" rx="10" fill="#ffffff" stroke="#e0ddd5"/>
    <text x="567" y="126" font-size="13.5" font-weight="700" fill="#1c1b19">4 · Scope check</text>
    <text x="567" y="146">git diff against</text>
    <text x="567" y="162">the step's own paths</text>

    <rect x="656" y="100" width="134" height="84" rx="10" fill="#ffffff" stroke="#e0ddd5"/>
    <text x="723" y="126" font-size="13.5" font-weight="700" fill="#1c1b19">5 · Verify</text>
    <text x="723" y="146">build, test, lint</text>
    <text x="723" y="162">commands you approved</text>

    <rect x="812" y="100" width="116" height="84" rx="10" fill="#23716b"/>
    <text x="870" y="126" font-size="13.5" font-weight="700" fill="#ffffff">6 · Commit</text>
    <text x="870" y="146" fill="#d9ece9">on bridge/&lt;id&gt;,</text>
    <text x="870" y="162" fill="#d9ece9">next step starts</text>
  </g>
  <g stroke="#8a857b" stroke-width="1.6">
    <line x1="166" y1="142" x2="186" y2="142" marker-end="url(#a)"/>
    <line x1="322" y1="142" x2="342" y2="142" marker-end="url(#a)"/>
    <line x1="478" y1="142" x2="498" y2="142" marker-end="url(#a)"/>
    <line x1="634" y1="142" x2="654" y2="142" marker-end="url(#a)"/>
    <line x1="790" y1="142" x2="810" y2="142" marker-end="url(#a)"/>
  </g>

  <path d="M723 184 C723 236 255 236 255 186" fill="none" stroke="#b03a31" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="489" y="252" font-size="12" fill="#b03a31" text-anchor="middle">a failed check goes back to the agent with the error, up to 2 times; then you get an alert</text>
  <text x="489" y="276" font-size="12" fill="#66625a" text-anchor="middle">plan limit: waits and retries by itself · network: retries in 5 min · laptop off: the step restarts when it is back</text>
</svg>
